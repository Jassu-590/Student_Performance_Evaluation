    <script>
      // Suppress Vite client dev WebSocket rejection in AI Studio preview iframe where HMR is disabled
      window.addEventListener('unhandledrejection', function(event) {
        if (event.reason && (String(event.reason.message || '')).includes('WebSocket')) {
          event.preventDefault();
        }
      });
